[project]
name = "dryrun"
version = "0.1.0"
description = "Agentic urban-flood digital twin for Lagos (Meta Global AI Developer Hackathon 2026)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pillow>=10",
  "networkx>=3.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "google-cloud-storage>=2.16",
]

[project.optional-dependencies]
# Eng A: solver speed (in the serving image)
sim = ["numba>=0.59"]
# Eng A: surrogate training (Modal / Cloud Run Job, NOT the serving image until Sat)
surrogate = ["lightgbm>=4.3", "pandas>=2.2", "pyarrow>=15"]
# Eng D: offline data pipeline (laptop / Cloud Shell only, never in the Cloud Run image)
pipeline = ["earthengine-api>=0.1.400", "rasterio>=1.3", "osmnx>=1.9", "geopandas>=0.14",
            "shapely>=2", "pyproj>=3.6", "pandas>=2.2", "pyarrow>=15"]
meta = ["websockets>=12", "meta-sam-parser==0.1.0"]
dev = ["meta-sam-parser==0.1.0", "pytest>=8", "ruff==0.16.9", "pydantic==2.13.5", "pandas>=2.2", "pyarrow>=15"]

[tool.setuptools.packages.find]
include = ["dryrun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["B008"]  # FastAPI File(...)/Form(...) defaults

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
