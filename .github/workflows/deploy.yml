name: deploy

# Deploys main to Cloud Run after ci passes on the same push. Pull requests, including fork
# PRs, can never reach the deploy job. Authenticates through Workload Identity Federation, so
# no service-account key is stored in GitHub. Needs repo *variables* (not secrets), printed by
# infra/scripts/wif.sh: GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # No project configured yet -> the job is skipped rather than failing every push.
    if: vars.GCP_PROJECT_ID != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SIM_BACKEND: ${{ vars.SIM_BACKEND }}
      AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER }}
      DEFAULT_AOI: ${{ vars.DEFAULT_AOI }}
      BUILDINGS_URL: ${{ vars.BUILDINGS_URL }}
    # This job holds cloud credentials, so its actions are pinned to commits, not tags.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - run: bash infra/scripts/deploy.sh
      - name: publish the URL
        run: |
          URL=$(gcloud run services describe "${SERVICE:-dryrun}" --project "$PROJECT_ID" \
                  --region "$REGION" --format='value(status.url)')
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

  # A workflow whose only real job is skipped still reports green. Without this, a "deploy ✓"
  # on the commit list means nothing was deployed -- a bad thing to discover on demo day.
  status:
    needs: deploy
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: say what actually happened
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "### Deployed to Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### NOT DEPLOYED — there is no live URL from this run"
              echo
              echo "deploy job: \`${{ needs.deploy.result }}\`"
              echo
              echo "The deploy job is gated on the \`GCP_PROJECT_ID\` repo variable, which is"
              echo "currently \`${{ vars.GCP_PROJECT_ID || '(unset)' }}\`. Run"
              echo "\`infra/scripts/wif.sh\` against a real project and set the four variables"
              echo "it prints. CI passing does not mean the site is up."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
